[project]
name = "mitoage-pipelines"
version = "0.1.0"
description = "Analysis code for MitoAge: longevity in mitochondrial alignments, mtDNA-encoded peptides, mito-nuclear pairing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "biopython",
    "huggingface_hub",
    "numpy",
    "pandas",
    "polars",
    "polars-bio",
    "pyarrow",
    "scipy",
    "statsmodels",
    "typer",
]

[project.scripts]
mitoage = "mitoage_pipelines.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
