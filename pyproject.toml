[project]
name = "mitoage-pipelines"
version = "0.1.0"
description = "Analysis code for MitoAge: longevity in mitochondrial alignments, mtDNA-encoded peptides, mito-nuclear pairing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "biopython",
    "huggingface_hub",
    "numpy",
    "pandas",
    "polars",
    "polars-bio",
    "pyarrow",
    "scipy",
    "statsmodels",
    "typer",
]

[project.scripts]
mitoage = "mitoage_pipelines.cli:main"

[dependency-groups]
dev = ["pytest"]
# `mitoage structure fold` only, on a CUDA machine: the published run had esm 3.4.3 and torch 2.15.0 on Python 3.14
fold = ["esm>=3.4.3; python_version >= '3.12'", "torch>=2.15; python_version >= '3.12'"]
# `mitoage mitoport cybrid-energy` only (H18): OpenMM on its CPU platform, PDBFixer to build the chimeric complexes
energy = ["openmm>=8.6", "pdbfixer>=1.12"]
# `mitoage mitoport cybrid-stab` only (H28): StaB-ddG at its pinned commit (the weights come by `mitoage download stabddg`)
stab = ["torch>=2.15; python_version >= '3.12'", "stab-ddg @ git+https://github.com/LDeng0205/StaB-ddG@b19a5d72637a6b581b16f38af39383658e5ae1a5"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
